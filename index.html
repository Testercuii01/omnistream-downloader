<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugoi Downloader! 🌸</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Nunito for a playful, rounded look -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'nunito': ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        'anime-pink': '#FFB7B2',
                        'anime-purple': '#E2C3FF',
                        'anime-blue': '#B5EAD7',
                        'anime-dark': '#2D3748'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom CSS for some extra flair */
        body {
            font-family: 'Nunito', sans-serif;
            /* A subtle anime-style pattern or gradient background */
            background: linear-gradient(135deg, #FFB7B2 0%, #E2C3FF 50%, #B5EAD7 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .kawaii-button {
            transition: all 0.2s ease-in-out;
        }
        .kawaii-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .kawaii-button:active {
            transform: scale(0.95);
        }
        
        /* Floating animation for the header emoji */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating-emoji {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass-panel rounded-3xl p-8 max-w-2xl w-full mx-auto relative overflow-hidden text-center">
        
        <!-- Decorative blobs -->
        <div class="absolute top-[-50px] left-[-50px] w-32 h-32 bg-anime-pink rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
        <div class="absolute top-[-50px] right-[-50px] w-32 h-32 bg-anime-blue rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-50px] left-20 w-32 h-32 bg-anime-purple rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>

        <div class="relative z-10">
            <!-- Header -->
            <h1 class="text-4xl md:text-5xl font-extrabold text-anime-dark mb-2 drop-shadow-md">
                Sugoi Downloader! <span class="floating-emoji">✨</span>
            </h1>
            <p class="text-gray-600 mb-8 font-semibold">Download video dari mana aja dengan mudah, Senpai~</p>

            <!-- Input Area -->
            <div class="flex flex-col md:flex-row gap-4 mb-8">
                <input type="text" id="linkInput" placeholder="Paste link video di sini ya..." 
                    class="flex-1 px-6 py-4 rounded-2xl border-2 border-anime-purple focus:outline-none focus:border-anime-pink bg-white/90 text-gray-700 shadow-inner placeholder-gray-400 transition-colors">
                <button id="downloadBtn" onclick="handleDownloadClick()"
                    class="kawaii-button bg-gradient-to-r from-anime-pink to-anime-purple text-white font-bold py-4 px-8 rounded-2xl shadow-lg border border-white/50">
                    Unduh Sekarang! 🚀
                </button>
            </div>

            <!-- Supported Platforms Indicator -->
            <div class="flex justify-center gap-4 mb-8 text-2xl opacity-70">
                <i class="fab fa-youtube hover:text-red-500 transition-colors"></i>
                <i class="fab fa-tiktok hover:text-black transition-colors"></i>
                <i class="fab fa-instagram hover:text-pink-500 transition-colors"></i>
                <i class="fab fa-twitter hover:text-blue-400 transition-colors"></i>
            </div>

            <!-- Status Area (Loading/Error) -->
            <div id="statusArea" class="hidden mb-6">
                <div id="loadingIndicator" class="hidden">
                    <p class="text-anime-dark font-bold text-lg animate-pulse">Chotto matte kudasai... (Tunggu sebentar) ⏳</p>
                    <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                        <div class="bg-anime-pink h-2.5 rounded-full" style="width: 45%; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
                    </div>
                </div>
                <div id="errorMessage" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-md text-left">
                    <p class="font-bold">Gomen nasai! (Maaf)</p>
                    <p id="errorText">Terjadi kesalahan saat mengambil video.</p>
                </div>
            </div>

            <!-- Result Area -->
            <div id="resultArea" class="hidden bg-white/60 rounded-2xl p-6 shadow-sm border border-white mt-6">
                <div class="flex flex-col md:flex-row gap-6 items-center md:items-start text-left">
                    <!-- Thumbnail -->
                    <div class="w-full md:w-1/3 flex-shrink-0">
                        <img id="videoThumbnail" src="https://placehold.co/400x225/E2C3FF/2D3748?text=Thumbnail" alt="Video Thumbnail" class="w-full h-auto rounded-xl shadow-md border-2 border-white">
                    </div>
                    
                    <!-- Video Info & Download Options -->
                    <div class="w-full md:w-2/3 flex flex-col justify-between h-full">
                        <div>
                            <h3 id="videoTitle" class="text-xl font-bold text-anime-dark mb-2 line-clamp-2">Judul Video Akan Muncul Di Sini</h3>
                            <p id="videoAuthor" class="text-sm text-gray-500 mb-4">By: @username</p>
                        </div>
                        
                        <div id="downloadOptions" class="flex flex-col gap-3 mt-4">
                            <!-- Buttons will be generated here by JS -->
                            <button class="kawaii-button bg-anime-blue text-anime-dark font-bold py-2 px-4 rounded-xl border border-white hover:bg-opacity-80 flex items-center justify-center gap-2">
                                <span>MP4 (720p)</span>
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            </button>
                            <button class="kawaii-button bg-gray-200 text-anime-dark font-bold py-2 px-4 rounded-xl border border-white hover:bg-gray-300 flex items-center justify-center gap-2">
                                <span>Audio (MP3)</span>
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
            // 3. Panggil API
            // Tampilkan Loading
            showLoading();

            try {
                // =====================================================================
                // CARA AGAR 100% WORK DI DUNIA NYATA:
                // 1. Daftar di rapidapi.com (cari "All in One Social Media Downloader")
                // 2. Dapatkan API Key
                // 3. Hapus/Comment kode SIMULASI di bawah, lalu Un-comment kode FETCH ini:
                // =====================================================================
                
                /*
                const apiUrl = `https://contoh-api-downloader.p.rapidapi.com/download?url=${encodeURIComponent(link)}`;
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': 'MASUKKAN_API_KEY_KAMU_DISINI',
                        'x-rapidapi-host': 'contoh-api-downloader.p.rapidapi.com'
                    }
                });
                const data = await response.json();
                
                // Lalu panggil fungsi displayResults(data) menyesuaikan format dari API tersebut
                */

                // --- SIMULASI RESPONS DARI API (UNTUK CEK UI/UX) ---
                // Simulasi delay jaringan selama 2 detik
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                const mockApiResponse = {
                    success: true,
                    title: "Opening Anime Terbaik - Musim Semi 2024",
                    author: "@AnimeFansClub",
                    thumbnailUrl: "https://placehold.co/400x225/E2C3FF/2D3748?text=Anime+OP",
                    downloads: [
                        { type: "Video", quality: "1080p", format: "mp4", url: "#" },
                        { type: "Video", quality: "720p", format: "mp4", url: "#" },
                        { type: "Audio", quality: "128kbps", format: "mp3", url: "#" }
                    ]
                };

                // Jika simulasi gagal
                // throw new Error("Gagal mengambil data dari server"); 

                // 4. Tampilkan Hasil
                displayResults(mockApiResponse);

            } catch (error) {
                showError("Ups! " + error.message);
            }
        }

        // --- FUNGSI-FUNGSI HELPER UTILITY ---

        // Memeriksa apakah text adalah URL yang valid
        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (err) {
                return false;
            }
        }

        // Menampilkan UI Loading
        function showLoading() {
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('resultArea').classList.add('hidden');
        }

        // Menampilkan Pesan Error
        function showError(message) {
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('loadingIndicator').classList.add('hidden');
            const errorContainer = document.getElementById('errorMessage');
            errorContainer.classList.remove('hidden');
            document.getElementById('errorText').innerText = message;
            document.getElementById('resultArea').classList.add('hidden');
        }

        // Menampilkan Data Hasil ke UI
        function displayResults(data) {
            // Sembunyikan loading
            document.getElementById('statusArea').classList.add('hidden');
            
            // Tampilkan area hasil
            const resultArea = document.getElementById('resultArea');
            resultArea.classList.remove('hidden');

            // Set data teks dan gambar
            document.getElementById('videoTitle').innerText = data.title;
            document.getElementById('videoAuthor').innerText = data.author;
            document.getElementById('videoThumbnail').src = data.thumbnailUrl;

            // Buat tombol download dinamis berdasarkan data
            const downloadOptionsContainer = document.getElementById('downloadOptions');
            downloadOptionsContainer.innerHTML = ''; // Kosongkan tombol lama

            data.downloads.forEach(dl => {
                const btn = document.createElement('button');
                
                // Styling berbeda untuk Video vs Audio
                if(dl.type === "Video") {
                    btn.className = "kawaii-button bg-anime-blue text-anime-dark font-bold py-2 px-4 rounded-xl border border-white hover:bg-opacity-80 flex items-center justify-center gap-2";
                } else {
                    btn.className = "kawaii-button bg-gray-200 text-anime-dark font-bold py-2 px-4 rounded-xl border border-white hover:bg-gray-300 flex items-center justify-center gap-2";
                }

                // Ikon SVG sederhana (Panah Bawah)
                const iconSvg = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>`;

                btn.innerHTML = `<span>${dl.type} (${dl.quality} - ${dl.format.toUpperCase()})</span> ${iconSvg}`;
                
                // Event saat tombol download spesifik diklik
                btn.onclick = () => {
                    // Dalam implementasi nyata, ini akan redirect ke URL download atau men-trigger download
                    alert(`Simulasi: Memulai download ${dl.format} kualitas ${dl.quality}... Yay! 🎉`);
                };

                downloadOptionsContainer.appendChild(btn);
            });
        }
    </script>
</body>
</html>
